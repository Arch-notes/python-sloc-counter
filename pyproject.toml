[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kazoe"
version = "0.1.0"
description = "CI-oriented step counter: function/unit-level counts and before/after comparison (Kazoe Chao! reimplementation in Python)"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.optional-dependencies]
dev = ["jsonschema>=4.0"]

[project.scripts]
kazoe = "kazoe.cli:main"

[tool.setuptools]
packages = ["kazoe"]
