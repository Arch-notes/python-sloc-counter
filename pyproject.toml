[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-sloc-counter"
version = "0.1.0"
description = "CI-oriented SLOC counter in Python: function/unit-level counts and before/after comparison"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.optional-dependencies]
dev = ["jsonschema>=4.0"]

[project.scripts]
python-sloc-counter = "python_sloc_counter.cli:main"

[tool.setuptools]
packages = ["python_sloc_counter"]
